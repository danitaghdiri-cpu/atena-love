
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>برای آتنا 💙</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- بارش قلب‌ها -->
    <div class="heart-rain"></div>


    <!-- صفحه اصلی -->
    <main class="container">

        <div class="card" id="questionCard">

            <div class="main-heart">
                💙
            </div>

            <h1>
                آتنا جان...
            </h1>

            <p class="question">
                یه سؤال مهم ازت دارم 🥺
            </p>

            <p class="love-question">
                منو دوست داری؟ 💙
            </p>


            <div class="buttons">

                <button class="yes-btn" id="yesBtn">
                    آره 💙
                </button>

                <button class="no-btn" id="noBtn">
                    نه 😐
                </button>

            </div>

        </div>


        <!-- صفحه بعد از زدن آره -->

        <div class="card success-card" id="successCard">

            <div class="big-heart">
                💙
            </div>

            <h1>
                آتنا... ❤️
            </h1>

            <p class="message">
                منم دوستت دارم
            </p>

            <p class="message-small">
                خیلی بیشتر از چیزی که بتونم با چندتا کلمه توضیح بدم...
            </p>

            <div class="divider">
                ✦ 💙 ✦
            </div>

            <p class="final-message">
                تو برای من یه آدم معمولی نیستی؛
                <br>
                تو یکی از قشنگ‌ترین اتفاق‌های زندگی منی.
            </p>

            <p class="signature">
                از طرف کسی که خیلی دوستت داره 💙
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
